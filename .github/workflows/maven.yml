name:Java CI/CD Pipeline
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflows_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      -name:Checkout Repository
      uses:actions/checkout@v4
      -name:Set up JDK 21
      uses:actions/setup-java@v4
      with:
        java-version:"21"
        distribution:"temurin"
      -name:Compile Java Program
      run: javac new.java
